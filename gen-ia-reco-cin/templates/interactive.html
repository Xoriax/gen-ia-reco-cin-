<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Movie Recommender - Conversational Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='conversation.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎬 Cine Recommender</h1>
            <p>Let's find your perfect movie, one question at a time</p>
        </div>

        <!-- Conversational Flow -->
        <div class="conversation-container">
            <!-- Chat History (Q&A Backlog) -->
            <div class="chat-history" id="chatHistory"></div>

            <!-- Current Question -->
            <div class="current-question" id="currentQuestion">
                <div class="question-bubble">
                    <h2 id="questionText"></h2>
                    <p id="questionSubtext"></p>
                    
                    <!-- Input Area -->
                    <div id="inputArea"></div>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="button-group">
                <button id="backBtn" class="btn-back" style="display: none;">← Back</button>
                <button id="nextBtn" class="btn-next">Continue →</button>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection" style="display: none;">
            <div class="results-header">
                <h2>🎯 Your Movie Recommendations</h2>
                <p>Based on your preferences</p>
            </div>

            <!-- Q&A Summary -->
            <div class="qa-summary" id="qaSummary"></div>

            <!-- GenAI Justification -->
            <div id="justificationBox"></div>

            <!-- Recommendations -->
            <div class="recommendations-grid" id="recommendationsGrid"></div>

            <!-- Back Button -->
            <div class="button-group">
                <button class="btn-back" onclick="location.reload()">← Start Over</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='conversation.js') }}"></script>
</body>
</html>
